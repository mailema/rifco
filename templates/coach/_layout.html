{% extends "base.html" %}
{% block content %}
<button class="mobile-dash-toggle"><i class="fa-solid fa-bars"></i> Menu</button>
<div class="dash-shell">
  <aside class="dash-sidebar">
    <div class="sidebar-title">Coaches Portal</div>
    <a href="{{ url_for('coach.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="{{ url_for('coach.players') }}" class="{{ 'active' if active == 'players' }}"><i class="fa-solid fa-futbol"></i> My Players</a>
    <a href="{{ url_for('coach.register_player') }}" class="{{ 'active' if active == 'register' }}"><i class="fa-solid fa-user-plus"></i> Register Player</a>
    <div class="sidebar-title" style="margin-top:14px;">Account</div>
    <a href="{{ url_for('auth.logout') }}"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
  </aside>
  <div class="dash-main">
    {% block dash_content %}{% endblock %}
  </div>
</div>
{% endblock %}
